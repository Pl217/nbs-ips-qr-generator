<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Генератор NBS IPS QR кодова за плаћања у Републици Србији"
    />
    <meta name="theme-color" content="#21425d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="IPS QR Generator" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="icon-192.svg" />
    <link rel="apple-touch-icon" href="icon-192.svg" />
    <title>Генератор NBS IPS QR кôда</title>
  </head>
  <body>
    <header>
      <div class="header-left">
        <button id="btn-menu" class="circle" aria-label="Menu">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
            fill="none"
          >
            <path d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <h1>Генератор NBS IPS QR кôда</h1>
      </div>
      <div class="header-right">
        <button id="btn-lang" class="circle">LAT</button>
        <button id="btn-theme" class="circle" aria-label="Toggle theme">
          <svg
            id="icon-sun"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <circle
              cx="12"
              cy="12"
              r="5"
              stroke="currentColor"
              stroke-width="1.5"
            />
            <path
              d="M12 2V4"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
            <path
              d="M12 20V22"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
            <path
              d="M4 12L2 12"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
            <path
              d="M22 12L20 12"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
            <path
              d="M19.7778 4.22266L17.5558 6.25424"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
            <path
              d="M4.22217 4.22266L6.44418 6.25424"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
            <path
              d="M6.44434 17.5557L4.22211 19.7779"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
            <path
              d="M19.7778 19.7773L17.5558 17.5551"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
          <svg
            id="icon-moon"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="currentColor"
            style="display: none"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </button>
      </div>
    </header>

    <div class="overlay" id="drawer-overlay"></div>
    <aside class="drawer" id="drawer">
      <h2 id="drawer-title">Сачувани кодови</h2>
      <ul id="saved-list"></ul>
    </aside>

    <main class="container">
      <p class="note">
        Сва поља обележена звездицом (<span class="asterisk">*</span>) морају
        бити попуњена.
      </p>

      <form id="ips-form" autocomplete="off">
        <div class="form-grid">
          <!-- Лева колона: платилац / сврха / прималац -->
          <div class="form-col form-col-left">
            <div class="form-group">
              <label for="field-P">Подаци о платиоцу</label>
              <textarea id="field-P" rows="3"></textarea>
              <div id="feedback-P" class="field-feedback"></div>
            </div>

            <div class="form-group">
              <label for="field-S">Сврха плаћања</label>
              <input type="text" id="field-S" maxlength="35" />
              <div id="feedback-S" class="field-feedback"></div>
            </div>

            <div class="form-group">
              <label for="field-N">
                Назив примаоца плаћања <span class="asterisk">*</span>
              </label>
              <textarea id="field-N" rows="3" required></textarea>
              <div id="feedback-N" class="field-feedback"></div>
            </div>
          </div>

          <!-- Десна колона: шифра/валута/износ, рачун примаоца, позив на број -->
          <div class="form-col form-col-right">
            <div class="form-row form-row-top">
              <div class="form-group form-group-sm">
                <label for="field-SF">
                  Шифра плаћања <span class="asterisk">*</span>
                </label>
                <select id="field-SF" required></select>
              </div>

              <div class="form-group form-group-sm">
                <label for="field-currency" id="label-currency">Валута</label>
                <input type="text" id="field-currency" value="RSD" disabled />
              </div>

              <div class="form-group form-group-lg">
                <label for="field-I">
                  Износ новчаних средстава <span class="asterisk">*</span>
                </label>
                <input
                  type="text"
                  id="field-I"
                  inputmode="decimal"
                  placeholder="545,95"
                  required
                />
                <div id="feedback-I" class="field-feedback"></div>
              </div>
            </div>

            <div class="form-group">
              <label for="field-R">
                Број рачуна примаоца <span class="asterisk">*</span>
              </label>
              <input
                type="text"
                id="field-R"
                inputmode="numeric"
                placeholder="105-0000000000000-29"
                required
              />
              <div id="feedback-R" class="field-feedback"></div>
              <div class="bank-info">
                <svg
                  id="bank-checkmark"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#10b981"
                  stroke-width="3"
                  style="display: none; flex-shrink: 0"
                >
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                <img id="bank-logo" class="bank-logo" alt="" />
                <span id="bank-name"></span>
              </div>
            </div>

            <div class="form-row form-row-ro">
              <div class="form-group form-group-sm">
                <label for="field-model" id="label-model">Модел</label>
                <input type="text" id="field-model" value="97" disabled />
              </div>

              <div class="form-group form-group-lg">
                <label for="field-RO">Позив на број одобрења</label>
                <input type="text" id="field-RO" />
                <div id="feedback-RO" class="field-feedback"></div>
              </div>
            </div>
          </div>
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 1rem">
          <button type="submit" class="btn-primary" style="flex: 2">
            Генериши Кôд
          </button>
          <button
            type="button"
            id="btn-save-code"
            class="btn-primary"
            style="flex: 1; background-color: #4b5563"
          >
            Сачувај
          </button>
        </div>
      </form>

      <div
        id="qr-result-container"
        class="hidden"
        style="margin-top: 2rem; text-align: center"
      >
        <hr />
        <h3>QR Кôд</h3>
        <canvas id="qr-canvas" width="300" height="300"></canvas>

        <p
          style="
            margin-top: 1rem;
            font-family: monospace;
            word-break: break-all;
            background: #f3f4f6;
            padding: 0.5rem;
          "
          id="qr-string-display"
        ></p>
      </div>
    </main>
  </body>
</html>
